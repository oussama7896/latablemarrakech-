  color: var(--lt-sand);
  font-family: var(--font-body);
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== film grain overlay ===== */
.grain::before {
  content: ""; position: fixed; inset: 0;
  pointer-events: none; z-index: 100;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.75 0 0 0 0 0.65 0 0 0 0 0.45 0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.06; mix-blend-mode: overlay;
}

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }

/* ===== type atoms ===== */
.display {
  font-family: var(--font-display);
  font-size: 124px;
  line-height: 0.92;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--lt-sand);
  margin: 0;
  font-weight: 400;
}
.display--md { font-size: 88px; }
.serif-italic {
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--lt-gold-light);
  font-weight: 400;
}
.section__italic {
  font-size: 0.72em;
  text-transform: none;
  letter-spacing: 0.01em;
  font-weight: 400;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--lt-sand-muted);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.eyebrow--ember { color: var(--lt-ember-light); }
.eyebrow--gold  { color: var(--lt-gold-light); }
.eyebrow .dot {
  width: 6px; height: 6px;
  background: var(--lt-ember);
  transform: rotate(45deg);
  display: inline-block;
}

p, .lead {
  font-family: var(--font-body);
  font-weight: 300;
  line-height: 1.7;
  color: var(--lt-sand);
  margin: 0 0 1em;
  text-wrap: pretty;
}
.lead { font-size: 19px; line-height: 1.65; }

/* ===== buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 14px 26px;
  background: var(--lt-ember); color: var(--lt-sand);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  border: none; border-radius: 2px; cursor: pointer;
  box-shadow: 0 2px 6px rgba(8,6,4,0.4);
  transition: background 220ms, transform 160ms, box-shadow 220ms;
  text-decoration: none;
}
.btn:hover  { background: var(--lt-ember-light); box-shadow: 0 0 0 1px rgba(217,112,64,0.4), 0 10px 30px rgba(217,112,64,0.3); }
.btn:active { background: var(--lt-ember-deep); transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--lt-gold-light); outline-offset: 3px; }
.btn--ghost {
  background: transparent;
  color: var(--lt-sand);
  border: 1px solid var(--lt-gold);
  box-shadow: none;
}
.btn--ghost:hover { color: var(--lt-gold-light); border-color: var(--lt-gold-light); background: rgba(184,147,90,0.08); box-shadow: none; }
.btn--lg { padding: 20px 42px; font-size: 13px; letter-spacing: 0.34em; }
.btn__diamond {
  width: 7px; height: 7px;
  background: currentColor;
  transform: rotate(45deg);
  display: inline-block;
}

/* ===== ornament divider ===== */
.ornament-hr {
  display: flex; align-items: center; gap: 16px;
  color: rgba(184,147,90,0.4);
  margin: 40px 0;
}
.ornament-hr::before, .ornament-hr::after {
  content: ""; flex: 1; height: 1px; background: currentColor;
}

/* ===== section base ===== */
.section { padding: 140px 0; position: relative; }
.section--flush { padding: 140px 0 0; }
.section--light {
  background: var(--lt-sand);
  color: var(--lt-ink);
}
.section--light .display,
.section--light p { color: var(--lt-ink); }
.section--light .eyebrow { color: var(--lt-gold-deep); }
.section--light .serif-italic { color: var(--lt-gold-deep); }

.section__head {
  display: flex; flex-direction: column; gap: 16px;
  margin-bottom: 16px;
}

/* ===== nav ===== */
.site-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 40px;
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  transition: background 300ms, backdrop-filter 300ms, padding 220ms;
}
.site-nav--scrolled {
  background: rgba(8,6,4,0.9);
  backdrop-filter: blur(8px);
  padding: 14px 40px;
  border-bottom: 1px solid var(--rule-faint);
}
.site-nav__brand img { height: 44px; display: block; }
.site-nav__links { display: flex; gap: 36px; }
.site-nav__links a {
  color: var(--lt-sand);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  text-decoration: none;
  opacity: 0.75;
  transition: opacity 200ms, color 200ms;
}
.site-nav__links a:hover { opacity: 1; color: var(--lt-gold-light); }
.site-nav__links a:focus-visible { outline: 2px solid var(--lt-gold-light); outline-offset: 3px; }

/* ===== hero ===== */
.hero {
  position: relative;
  min-height: 100vh;
  padding: 160px 0 100px;
  overflow: hidden;
  display: flex; align-items: center;
}
.hero__bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  z-index: 0;
  /* Background image is the poster fallback shown if the video is blocked or still loading. */
}
.hero__video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 1;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  .hero__video { display: none; }
}
.hero__bg-grad {
  position: absolute; inset: 0;
  background:
    radial-gradient(60% 80% at 28% 36%, rgba(217,112,64,0.55), transparent 60%),
    radial-gradient(52% 70% at 82% 64%, rgba(212,170,112,0.35), transparent 65%),
    linear-gradient(160deg, #2A1710, #08060400);
  mix-blend-mode: multiply;
  z-index: 2;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.7 0 0 0 0 0.55 0 0 0 0 0.35 0 0 0 0.6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.25; mix-blend-mode: overlay;
  z-index: 3; pointer-events: none;
}
.hero__veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8,6,4,0.25) 0%, rgba(8,6,4,0.55) 60%, rgba(8,6,4,0.95) 100%);
  z-index: 3;
}
.hero__inner { position: relative; z-index: 4; }
.hero__title { margin-top: 24px; max-width: 1000px; }
.hero__title-italic {
  font-size: 0.72em;
  font-weight: 400;
  letter-spacing: 0.02em;
  text-transform: none;
}
.hero__lead { max-width: 560px; margin-top: 28px; font-size: 19px; }
.hero__cta { display: flex; gap: 14px; margin-top: 40px; flex-wrap: wrap; }
.hero__strip {
  display: flex; gap: 56px; margin-top: 80px;
  padding-top: 28px; border-top: 1px solid var(--rule);
  flex-wrap: wrap;
}
.hero__step { display: flex; gap: 14px; align-items: baseline; }
.hero__step-num { color: var(--lt-ember-light); }
.hero__step-t { font-size: 20px; }
.hero__scroll {
  position: absolute; bottom: 40px; left: 40px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  z-index: 2;
}
.hero__scroll-line {
  width: 1px; height: 40px;
  background: linear-gradient(180deg, var(--lt-gold) 0%, transparent 100%);
}

/* ===== real image tiles ===== */
.img-tile {
  position: relative; overflow: hidden;
  background: var(--lt-ink-soft);
}
.img-tile img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: high-quality;
  transform: translateZ(0);
  backface-visibility: hidden;
}
.img-tile::after {
  content: ""; position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6 0 0 0 0 0.48 0 0 0 0 0.3 0 0 0 0.6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.22; mix-blend-mode: overlay; pointer-events: none;
}
.img-tile--dark::before {
  content: ""; position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(8,6,4,0.3) 0%, rgba(8,6,4,0.6) 100%);
  pointer-events: none;
}

/* ===== placeholder tonal images ===== */
.ph-hero   { background: radial-gradient(60% 80% at 30% 40%, rgba(217,112,64,0.5), transparent 60%), radial-gradient(50% 70% at 80% 60%, rgba(212,170,112,0.4), transparent 65%), linear-gradient(160deg, #2A1F16, #0A0804); }
.ph-warm   { background: radial-gradient(70% 100% at 50% 50%, rgba(212,170,112,0.5), transparent 70%), linear-gradient(180deg, #3A2815, #120C06); }
.ph-embers { background: radial-gradient(50% 80% at 40% 70%, rgba(193,98,47,0.65), transparent 60%), radial-gradient(35% 60% at 75% 35%, rgba(217,112,64,0.5), transparent 60%), linear-gradient(160deg, #200F08, #0A0604); }
[class*="ph-"] { position: relative; overflow: hidden; }
[class*="ph-"]::after {
  content: ""; position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6 0 0 0 0 0.48 0 0 0 0 0.3 0 0 0 0.6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.22; mix-blend-mode: overlay; pointer-events: none;
}

/* ===== three-up experience ===== */
.three-up {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 36px; margin-top: 12px;
}
.three-up__item { display: flex; flex-direction: column; gap: 14px; }
.three-up__img { aspect-ratio: 1/1; border-radius: 4px; }
.three-up__item .eyebrow { margin-top: 12px; }
.three-up__dish {
  font-size: 14px; line-height: 1.45;
  color: var(--lt-gold-light); opacity: 0.78;
  letter-spacing: 0.01em;
  margin-top: -4px;
}
.three-up__title { font-size: 32px; line-height: 1.1; color: var(--lt-gold-light); margin: 0; }
.three-up__item p { font-size: 15.5px; color: var(--lt-sand); opacity: 0.9; }

/* ===== menus (light) ===== */
.menus__lead { max-width: 560px; margin-top: 12px; color: var(--lt-ink); }
.menu-list { margin-top: 12px; }
.menu-row {
  display: grid;
  grid-template-columns: 140px 1fr auto;
  gap: 28px; align-items: center;
  padding: 22px 0;
  border-bottom: 1px solid rgba(139,106,58,0.25);
}
.menu-row__course { color: var(--lt-gold-deep); font-size: 11px; }
.menu-row__name {
  font-family: var(--font-display);
  font-size: 34px; line-height: 1;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--lt-ink);
}
.menu-row__it { font-size: 17px; margin-top: 4px; color: var(--lt-gold-deep); }
.menu-row__chip {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 6px 14px;
  border: 1px solid rgba(139,106,58,0.4);
  border-radius: 999px;
  color: var(--lt-gold-deep);
}
.menus__cta { display: flex; gap: 18px; align-items: center; margin-top: 36px; }
.menus__pdf {
  color: var(--lt-gold-deep);
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.3em;
  text-transform: uppercase;
  text-decoration: none;
  border-bottom: 1px solid rgba(139,106,58,0.4);
  padding-bottom: 2px;
}
.menus__pdf:hover { color: var(--lt-ember); border-color: var(--lt-ember); }
.menus__pdf:focus-visible { outline: 2px solid var(--lt-gold-light); outline-offset: 3px; }

/* ===== pullquote ===== */
.pullquote { padding: 60px 0; background: var(--lt-ink-soft); }
.pullquote blockquote {
  margin: 0; text-align: center;
  max-width: 900px; margin: 0 auto;
}
.pullquote__text {
  display: block;
  font-size: 40px;
  line-height: 1.25;
  color: var(--lt-gold-light);
  letter-spacing: 0.01em;
}
.pullquote footer { display: block; margin-top: 22px; color: var(--lt-sand-muted); }

/* ===== gallery ===== */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 1fr;
  gap: 6px;
  margin-top: 60px;
}
.gallery__tile {
  aspect-ratio: 1/1;
  position: relative;
  overflow: hidden;
}
.gallery__tile img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.gallery__tile figcaption {
  position: absolute; bottom: 16px; left: 16px;
  color: var(--lt-sand);
  font-size: 10px;
  z-index: 2;
}
@media (max-width: 760px) {
  .gallery { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .gallery { grid-template-columns: 1fr; }
}

/* ===== pricing ===== */
.tiers {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: 10px;
}
.tier {
  position: relative;
  padding: 32px 28px;
  background: var(--lt-ink-soft);
  border: 1px solid var(--rule-faint);
  border-radius: 4px;
  display: flex; flex-direction: column; gap: 22px;
}
.tier--feat {
  background: linear-gradient(180deg, #1A140E, #100D08);
  border-color: rgba(193,98,47,0.45);
  box-shadow: 0 24px 60px rgba(8,6,4,0.55), 0 0 0 1px rgba(193,98,47,0.15);
}
.tier__ribbon {
  position: absolute; top: -12px; left: 28px;
  background: var(--lt-ember);
  color: var(--lt-sand);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 2px;
}
.tier__head { display: flex; flex-direction: column; gap: 8px; }
.tier__from {
  font-family: var(--font-display);
  font-size: 58px; line-height: 1;
  letter-spacing: 0.04em;
  color: var(--lt-sand);
}
.tier--feat .tier__from { color: var(--lt-ember-light); }
.tier__sub { font-size: 17px; color: var(--lt-gold-light); }
.tier__list {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 12px;
  border-top: 1px solid var(--rule-faint);
  padding-top: 22px;
}
.tier__list li {
  display: flex; align-items: flex-start;
  font-size: 15px; line-height: 1.5;
  color: var(--lt-sand);
}

/* ===== chef ===== */
.chef { padding: 140px 0; background: var(--lt-ink-soft); position: relative; }
.chef__inner {
  display: grid;
  grid-template-columns: 0.7fr 1.3fr;
  gap: 80px;
  align-items: center;
}
.chef__portrait {
  aspect-ratio: 1/1;
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  max-width: 380px;
}
.chef__portrait img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.chef__portrait-vignette {
  position: absolute; inset: 0;
  background: radial-gradient(60% 60% at 50% 40%, transparent 40%, rgba(8,6,4,0.6) 100%);
  z-index: 1;
  pointer-events: none;
}
.chef__copy { display: flex; flex-direction: column; gap: 20px; }
.chef__copy p { font-size: 17px; line-height: 1.75; color: var(--lt-sand); opacity: 0.92; }
.quote-line {
  padding-left: 22px;
  border-left: 1px solid var(--lt-ember);
}
.quote-line .serif-italic { font-size: 22px; line-height: 1.45; }

/* ===== booking ===== */
.booking { background: var(--lt-ink); }
.booking__grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 56px;
  margin-top: 12px;
}
.booking__right { display: flex; flex-direction: column; gap: 28px; }
.booking__field { display: flex; flex-direction: column; gap: 12px; }
.booking__hint {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 14px;
  color: var(--lt-sand-muted);
}
.card {
  background: var(--lt-ink-soft);
  border: 1px solid var(--rule-faint);
  border-radius: 4px;
  padding: 28px 30px;
}
.counter { display: flex; align-items: center; gap: 18px; }
.counter button {
  background: transparent;
  border: 1px solid var(--lt-gold);
  color: var(--lt-sand);
  width: 40px; height: 40px;
  border-radius: 2px;
  font-size: 20px;
  cursor: pointer;
  transition: background 160ms, border-color 160ms;
}
.counter button:hover { background: rgba(184,147,90,0.1); border-color: var(--lt-gold-light); }
.counter button:focus-visible { outline: 2px solid var(--lt-gold-light); outline-offset: 3px; }
.counter__v {
  font-family: var(--font-display);
  font-size: 44px;
  color: var(--lt-sand);
  min-width: 56px;
  text-align: center;
  letter-spacing: 0.03em;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 16px;
  background: rgba(184,147,90,0.08);
  color: var(--lt-sand);
  border: 1px solid rgba(184,147,90,0.4);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.24em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 180ms, border-color 180ms, color 180ms;
}
.chip:hover { border-color: var(--lt-gold-light); }
.chip:focus-visible { outline: 2px solid var(--lt-gold-light); outline-offset: 3px; }
.chip--on { background: var(--lt-ember); color: var(--lt-sand); border-color: var(--lt-ember); }

.field { display: flex; flex-direction: column; gap: 10px; }
.field input {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--rule-strong);
  color: var(--lt-sand);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 18px;
  padding: 8px 2px;
  outline: none;
  transition: border-color 200ms;
}
.field input:focus { border-bottom-color: var(--lt-ember); }

.textarea {
  background: transparent;
  border: 1px solid var(--rule);
  color: var(--lt-sand);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 16px;
  padding: 12px 14px;
  border-radius: 2px;
  outline: none;
  resize: vertical;
  width: 100%;
  box-sizing: border-box;
  margin-top: 8px;
  min-height: 88px;
}
.textarea::placeholder { color: var(--lt-sand-muted); opacity: 0.55; }
.textarea:focus { border-color: var(--lt-ember); }

.cal__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
.cal__nav { display: inline-flex; align-items: center; gap: 10px; }
.cal__navbtn {
  appearance: none; background: transparent; border: 1px solid var(--rule-faint);
  color: var(--lt-gold-light); width: 26px; height: 26px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; line-height: 1; cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
}
.cal__navbtn:hover:not(:disabled) { border-color: var(--lt-ember); color: var(--lt-ember); }
.cal__navbtn:focus-visible { outline: 2px solid var(--lt-gold-light); outline-offset: 2px; }
.cal__navbtn:disabled { opacity: 0.25; cursor: not-allowed; }
.cal__dow {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--lt-sand-muted);
  margin-bottom: 8px;
}
.cal__dow > div { text-align: center; }
.cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal__cell {
  aspect-ratio: 1/1;
  background: transparent;
  border: 1px solid var(--rule-faint);
  color: var(--lt-sand);
  font-family: var(--font-serif);
  font-size: 16px;
  border-radius: 2px;
  cursor: pointer;
  transition: background 180ms, border-color 180ms;
}
.cal__cell:hover:not(:disabled) { background: rgba(184,147,90,0.1); border-color: var(--lt-gold); }
.cal__cell:focus-visible { outline: 2px solid var(--lt-gold-light); outline-offset: 2px; }
.cal__cell--on { background: var(--lt-ember); color: var(--lt-sand); border-color: var(--lt-ember); }
.cal__cell--past { opacity: 0.3; cursor: not-allowed; color: var(--lt-muted); }

.booking__summary { margin-top: 40px; padding: 32px 36px; }
.booking__summary-row {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-top: 12px;
  gap: 32px;
}
.booking__summary-title {
  font-family: var(--font-display);
  font-size: 48px;

function Chip({ on, active, children }) {
  return (
    <button onClick={on} className={`chip ${active ? 'chip--on' : ''}`} aria-pressed={active}>{children}</button>
  );
}
function MiniCal({ value, onChange }) {
  const today = new Date();
  const todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();
  const [view, setView] = useState({ y: todayY, m: todayM });
  const maxView = todayY * 12 + todayM + 12; // cap navigation at +12 months
  const curView = view.y * 12 + view.m;
  const canPrev = curView > todayY * 12 + todayM;
  const canNext = curView < maxView;
  const days = new Date(view.y, view.m + 1, 0).getDate();
  const first = new Date(view.y, view.m, 1).getDay();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  const iso = d => `${view.y}-${String(view.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const shift = delta => {
    const total = view.y * 12 + view.m + delta;
    setView({ y: Math.floor(total / 12), m: ((total % 12) + 12) % 12 });
  };
  return (
    <div className="cal" role="group" aria-label="Pick a date">
      <div className="cal__head">
        <div className="cal__nav">
          <button type="button" onClick={() => shift(-1)} disabled={!canPrev}
            aria-label="Previous month" className="cal__navbtn">&lsaquo;</button>
          <span className="eyebrow eyebrow--gold">{'\u25c6'} {monthNames[view.m]} {view.y}</span>
          <button type="button" onClick={() => shift(1)} disabled={!canNext}
            aria-label="Next month" className="cal__navbtn">&rsaquo;</button>
        </div>
        <span className="eyebrow">&mdash; Pick a night</span>
      </div>
      <div className="cal__dow" aria-hidden="true">
        {['S','M','T','W','T','F','S'].map((d,i)=><div key={i}>{d}</div>)}
      </div>
      <div className="cal__grid">
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const cellTime = new Date(view.y, view.m, d).getTime();
          const todayTime = new Date(todayY, todayM, todayD).getTime();
          const isPast = cellTime < todayTime;
          const isSel = value === iso(d);
          return (
            <button key={i} disabled={isPast} onClick={() => onChange(iso(d))}
              aria-label={`${monthNames[view.m]} ${d}`}
              aria-selected={isSel}
              className={`cal__cell ${isSel ? 'cal__cell--on' : ''} ${isPast ? 'cal__cell--past' : ''}`}>
              {d}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${days[d.getDay()]} \u00b7 ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
